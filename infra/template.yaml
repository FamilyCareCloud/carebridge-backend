AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FCC backend - Cognito, HTTP API, Lambda and DynamoDB
Parameters:
  AppVersion:
    Type: String
    Default: local
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Exact allowed frontend origin (use HTTPS for deployment)
  SesIdentityArn:
    Type: String
    Default: ''
    Description: Verified SES identity ARN for Cognito email (use the user pool region)
  AuthFromEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^ <>@]+@[^ <>@]+\.[^ <>@]+$'
    Description: Email address covered by the verified SES identity
  BedrockModelId:
    Type: String
    Default: ''
    Description: Available Converse model ID; blank selects explicitly labelled offline mode
  BedrockModelArn:
    Type: String
    Default: ''
    Description: IAM ARN for the same regional foundation model (cross-region profiles need additional IAM configuration)
  CarebridgeServiceUrl:
    Type: String
    Default: ''
    Description: Authenticated CareBridge GPU service URL
  CarebridgeServiceApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Shared X-API-Key for CareBridge
  CarebridgeTimeoutMs:
    Type: Number
    Default: 22000
    MinValue: 1000
    MaxValue: 24000
    Description: AI call timeout below the Lambda budget
Conditions:
  HasCustomEmail: !Not [!Equals [!Ref SesIdentityArn, '']]
  HasModel: !Not [!Equals [!Ref BedrockModelId, '']]
Rules:
  EmailParametersTogether:
    Assertions:
      - Assert: !Or
          - !And [!Equals [!Ref SesIdentityArn, ''], !Equals [!Ref AuthFromEmail, '']]
          - !And [!Not [!Equals [!Ref SesIdentityArn, '']], !Not [!Equals [!Ref AuthFromEmail, '']]]
        AssertDescription: SesIdentityArn and AuthFromEmail must both be provided or both omitted
  ModelArnRequired:
    RuleCondition: !Not [!Equals [!Ref BedrockModelId, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref BedrockModelArn, '']]
        AssertDescription: BedrockModelArn is required when BedrockModelId is provided
Resources:
  Database:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAtEpoch
        Enabled: true
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EmailConfiguration: !If
        - HasCustomEmail
        - EmailSendingAccount: DEVELOPER
          SourceArn: !Ref SesIdentityArn
          From: !Sub 'Family Care Cloud <${AuthFromEmail}>'
        - !Ref AWS::NoValue
      VerificationMessageTemplate: !If
        - HasCustomEmail
        - DefaultEmailOption: CONFIRM_WITH_CODE
          EmailSubject: '[Family Care Cloud] 이메일 인증코드'
          EmailMessage: |
            <!doctype html>
            <html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Care Cloud 이메일 인증</title></head>
            <body style="margin:0;background:#ffffff;color:#24292f;font-family:Arial,'Malgun Gothic',sans-serif;line-height:1.6">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center" style="padding:32px 16px">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px">
            <tr><td align="center" style="font-size:20px;font-weight:bold;padding-bottom:18px;color:#237563">Family Care Cloud</td></tr>
            <tr><td align="center" style="font-size:26px;padding-bottom:24px">이메일 주소를 인증해주세요</td></tr>
            <tr><td style="border:1px solid #d0d7de;border-radius:8px;padding:24px">
            <p style="margin:0 0 20px">Family Care Cloud 가입을 위한 인증코드입니다.</p>
            <p style="text-align:center;font-family:monospace;font-size:32px;letter-spacing:8px;margin:24px 0" aria-label="인증코드">{####}</p>
            <p>이 코드는 <strong>24시간 동안 유효</strong>하며, 인증 완료 후 다시 사용할 수 없습니다.</p>
            <p><strong>인증코드를 다른 사람에게 공유하지 마세요.</strong><br>Family Care Cloud는 전화나 이메일로 인증코드를 요청하지 않습니다.</p>
            <p style="margin-bottom:0">감사합니다.<br>Family Care Cloud 팀</p>
            </td></tr>
            <tr><td style="padding-top:22px;color:#6e7781;font-size:13px">이 이메일은 Family Care Cloud 계정의 이메일 인증 요청으로 발송되었습니다. 본인이 요청하지 않았다면 이 이메일을 무시해주세요.</td></tr>
            </table></td></tr></table></body></html>
        - !Ref AWS::NoValue
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: true
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: true
          Mutable: true
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      CorsConfiguration:
        AllowOrigins: [!Ref FrontendOrigin]
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
  Backend:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src/handlers/lambda.handler
      Runtime: nodejs22.x
      MemorySize: 512
      Timeout: 29
      Environment:
        Variables:
          APP_VERSION: !Ref AppVersion
          CAREBRIDGE_MULTIPLE_WORKSPACES: 'false'
          CAREBRIDGE_CONFIRMATION_ENABLED: 'true'
          CAREBRIDGE_TRANSFER_ENABLED: 'true'
          CAREBRIDGE_RECIPIENT_CHANGE: block_all
          WEBSOCKET_URL: !Sub 'wss://${WorkspaceSocket}.execute-api.${AWS::Region}.${AWS::URLSuffix}/live'
          DYNAMODB_TABLE: !Ref Database
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          COGNITO_USER_POOL_ID: !Ref UserPool
          CAREBRIDGE_SERVICE_URL: !Ref CarebridgeServiceUrl
          CAREBRIDGE_SERVICE_API_KEY: !Ref CarebridgeServiceApiKey
          CAREBRIDGE_TIMEOUT_MS: !Ref CarebridgeTimeoutMs
          AI_PROVIDER: !If [HasModel, bedrock, local]
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt Database.Arn
            - Effect: Allow
              Action: [cognito-idp:AdminGetUser]
              Resource: !GetAtt UserPool.Arn
            - !If
              - HasModel
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource: !Ref BedrockModelArn
              - !Ref AWS::NoValue
      Events:
        Routes:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY
  WorkspaceSocket:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-workspace-events'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'
  SocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WorkspaceSocket
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Realtime.Arn}/invocations'
  SocketConnect:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WorkspaceSocket
      RouteKey: '$connect'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${SocketIntegration}'
  SocketDisconnect:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WorkspaceSocket
      RouteKey: '$disconnect'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${SocketIntegration}'
  SocketDefault:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WorkspaceSocket
      RouteKey: '$default'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${SocketIntegration}'
  SocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WorkspaceSocket
      StageName: live
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 30
        ThrottlingRateLimit: 15
  SocketPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Realtime
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WorkspaceSocket}/*'
  Realtime:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: src/handlers/websocket.handler
      Runtime: nodejs22.x
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref Database
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          WEBSOCKET_MANAGEMENT_URL: !Sub 'https://${WorkspaceSocket}.execute-api.${AWS::Region}.${AWS::URLSuffix}/live'
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt Database.Arn
            - Effect: Allow
              Action: [dynamodb:GetRecords, dynamodb:GetShardIterator, dynamodb:DescribeStream, dynamodb:ListStreams]
              Resource: !GetAtt Database.StreamArn
            - Effect: Allow
              Action: [execute-api:ManageConnections]
              Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WorkspaceSocket}/live/*/@connections/*'
      Events:
        WorkspaceChanges:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt Database.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 0
            BisectBatchOnFunctionError: true
            FunctionResponseTypes: [ReportBatchItemFailures]
            FilterCriteria:
              Filters:
                - Pattern: '{"dynamodb":{"Keys":{"pk":{"S":[{"prefix":"workspace#"},{"prefix":"user#"},{"prefix":"realtime-revoke#"}]}}}}'
        ExpiredConnections:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
  RealtimeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Realtime}'
      RetentionInDays: 14
  BackendLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Backend}'
      RetentionInDays: 14
Outputs:
  WebSocketUrl:
    Value: !Sub 'wss://${WorkspaceSocket}.execute-api.${AWS::Region}.${AWS::URLSuffix}/live'
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  TableName:
    Value: !Ref Database
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
